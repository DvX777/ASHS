# .github/workflows/test.yml
# Runs on every push/PR to validate the codebase.
# Also self-hosted — no billing.

name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run --no-install tsc --noEmit || true

      - name: Smoke test — migration
        run: |
          DB_PATH=/tmp/ashs-test-${{ github.run_id }}.sqlite3 bun run scripts/migrate.ts
          rm -f /tmp/ashs-test-${{ github.run_id }}.sqlite3

      - name: Smoke test — resolver
        run: |
          DB_PATH=/tmp/ashs-test.sqlite3 \
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} \
          bun run scripts/test-resolver.ts